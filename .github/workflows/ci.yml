name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  lint:
    name: Lint (ruff) and type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  smoke:
    name: Smoke test (load GPT-2, one inference per path, check shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gpt2-v1
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Smoke test
        run: python -m scripts.smoke_test --model gpt2
      - name: Quick benchmark (FP32 vs INT8)
        run: |
          python -m benchmarks.run_benchmarks --models gpt2 \
            --strategies fp32 int8-dynamic int8-dynamic-static-kv \
            --new-tokens 16 --repeats 1 --skip-perplexity --skip-alloc-trace \
            --out results/ci-smoke.json

  docker:
    name: Docker image (CPU) and smoke test inside it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --target cpu -t llm-inference-optimizer:cpu .
      - name: Smoke test in container
        run: docker run --rm llm-inference-optimizer:cpu scripts.smoke_test --model gpt2
